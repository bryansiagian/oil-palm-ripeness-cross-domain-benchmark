
# Shared class taxonomy for cross-domain object detection.

version: "1.0"

strategy: strict_intersection

nc: 2

names:
  0: Unripe
  1: Ripe

datasets:
  dataset1:
    domain: south_kalimantan_mill
    annotation_format: yolo

    original_names:
      0: Empty Bunch
      1: Under-ripe
      2: Abnormal FFB
      3: Ripe
      4: Unripe
      5: Over Ripe

    class_mapping:
      0: null
      1: null
      2: null
      3: 1
      4: 0
      5: null

  dataset2:
    domain: central_kalimantan_plantation
    annotation_format: yolo

    original_names:
      0: Abnormal
      1: Flower
      2: Ripe
      3: Underripe
      4: Unripe

    class_mapping:
      0: null
      1: null
      2: 1
      3: null
      4: 0

  dataset3:
    domain: malaysia_plantation
    annotation_format: image_classification
    requires_bbox_annotation: true

    original_names:
      - Damaged
      - Empty
      - Overripe
      - Ripe
      - Unripe

    class_mapping:
      Damaged: null
      Empty: null
      Overripe: null
      Ripe: 1
      Unripe: 0

preprocessing:
  preserve_raw_data: true
  preserve_original_splits: true
  preserve_bbox_coordinates: true
  non_target_annotation_policy: remove
  mixed_class_image_policy: keep
  no_target_image_policy: exclude
  output_directory: data/processed
